name: tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests (offline, recorded fixtures)
        run: python3 -E -s -m unittest discover -s tests -t . -v
      - name: Finding-record fixtures
        run: python3 -E -s -m kt.finding tests/fixtures/findings/valid/*.json

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Secret scan (whole tree)
        run: python3 -E -s scripts/secret_scan.py .
      - name: Secret scan (every commit in this push or PR)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -E -s scripts/secret_scan.py --git-range "$BASE" .

  actions-pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every action is pinned to a full commit SHA
        run: python3 -E -s scripts/check_pins.py .github/workflows
